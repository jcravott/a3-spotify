<div class="progress">
	<!--set style.background-color based on the level of popularity and style.width via the popularity's percent. Display percent.-->
  <div class="progress-bar" role="progressbar"
    [style.background-color]="popularity?.color ?? 'red'"
    [style.width.%]="(popularity?.percent ?? 0) * 100"
    [attr.aria-label]="label" [attr.aria-valuenow]="popularity ? popularity.percent * 100 : null"
    aria-valuemin="0" aria-valuemax="100">
    <span class="progress-bar-text">{{ label }}: {{ popularity?.percentageString ?? 'Unavailable' }}</span>
  </div>
</div>
