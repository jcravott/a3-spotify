@if(errorMessage) {
	<p role="alert">{{ errorMessage }}</p>
}
@if(artist) {
	<div class="row">
		<div class="col-xl-4 col-12">
			<!--populate with artist name-->
			<h1>{{ artist.name }}</h1>
			<app-favorite-button [resource]="artist"></app-favorite-button>
			<!--populate with artist image URL-->
			<img id="artistImg" style="max-width: min(400px, 100%);" [src]="artist.imageURL" [alt]="artist.name">
			@if(artist.genres?.length) {
				<p>Genres: {{ artist.genres.join(', ') }}</p>
			}
			<p>
				<!--link to artist page on spotify, display artist name-->
				<a class="btn btn-light" role="button" [href]="artist.url" target="_blank" rel="noopener noreferrer">Open {{ artist.name }} on Spotify</a>
			</p>
		</div>
		<div class="col-xl-4 col-12">
			<h3>Popularity</h3>
			<!--display the number of followers, formatted with commas for thousands/millions-->
			<p>{{ artist.followersStr }} followers</p>
			<app-thermometer [popularity]="artist.popularity"></app-thermometer>
			<!--display artist name-->
			<h3>{{ artist.name }}'s Albums</h3>
			<!--Display a carousel component for the artist's albums. Bind carousel's resources and give it a static carouselId.-->
			<app-carousel [resources]="albums" carouselId="artist-albums-carousel"></app-carousel>
		</div>
		<div class="col-xl-4 col-12">
			<!--display artist name-->
			<h3>{{ artist.name }}'s Top Tracks</h3>
			<!--display the artist's top tracks-->
			<app-track-list [tracks]="topTracks" [hideArtist]="true"></app-track-list>
		</div>
	</div>
}
